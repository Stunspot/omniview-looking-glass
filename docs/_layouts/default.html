<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OmniView">
  <meta property="og:title" content="{{ page.title | default: site.title }} | OmniView">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/brand/omniview-social-preview.jpg' | absolute_url }}">
  <meta property="og:image:secure_url" content="{{ '/assets/brand/omniview-social-preview.jpg' | absolute_url }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="OmniView aperture spanning an ancient river city, open ocean, and an electric twentieth-century street.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }} | OmniView">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/brand/omniview-social-preview.jpg' | absolute_url }}">
</head>
<body>
  <main id="content" class="main-content" role="main">
    {{ content }}
    <footer class="site-footer">
      <span>OmniView is an independent Collaborative Dynamics companion inspired by Pliny the Liberator's GL4SS.</span>
    </footer>
  </main>
</body>
</html>
